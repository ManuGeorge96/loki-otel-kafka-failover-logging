# Grafana Loki — Helm values (chart: grafana/loki, SimpleScalable mode)
#
# Install:
#   helm upgrade --install loki grafana/loki -n loki --create-namespace -f loki/values.yaml
#
# Replace every <PLACEHOLDER> before installing (see README → "Values you must replace").

deploymentMode: SimpleScalable

# ---- Read / Write / Backend replica counts (Simple Scalable targets) ----
write:
  replicas: 3          # ingesters/distributors — receive and flush logs to S3
read:
  replicas: 5          # queriers/query-frontend — serve Grafana queries
backend:
  replicas: 4          # compactor, index gateway, ruler, query scheduler

# ---- Built-in memcached caches deployed by the chart ----
chunksCache:
  allocatedMemory: 8192
  maxItemSize: 10m
resultsCache:
  enabled: true
  allocatedMemory: 4096
  maxItemSize: 50m

# ---- Gateway (nginx) exposed through an INTERNAL AWS NLB with TLS ----
gateway:
  enabled: true
  ingress:
    enabled: true
    hosts:
      - host: loki.<YOUR_DOMAIN>
        paths:
          - path: /
            pathType: Prefix
  service:
    type: LoadBalancer
    loadBalancerSourceRanges:
      - 10.0.0.0/8                       # only reachable from inside the VPC / peered networks
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-internal: "true"
      service.beta.kubernetes.io/aws-load-balancer-backend-protocol: http
      service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "<ACM_CERTIFICATE_ARN>"
      service.beta.kubernetes.io/aws-load-balancer-ssl-ports: https
      service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: ingress.k8s.aws/stack=loki-scalable-deployment

# ---- IRSA: lets Loki pods read/write the S3 bucket without static keys ----
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<AWS_ACCOUNT_ID>:role/<LOKI_S3_ROLE_NAME>"

loki:
  auth_enabled: false     # single-tenant

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: s3
    bucketNames:
      chunks: "<LOKI_S3_BUCKET>"
      ruler: "<LOKI_S3_BUCKET>"
      admin: "<LOKI_S3_BUCKET>"
    s3:
      region: "<AWS_REGION>"
      s3ForcePathStyle: false
      http_config: {}

  ingester:
    chunk_encoding: snappy
    chunk_idle_period: 30m
    chunk_target_size: 10485760    # 10 MiB
    max_chunk_age: 2h
    flush_op_backoff:
      min_period: 30s
      max_period: 2m
      max_retries: 10

  limits_config:
    retention_period: 672h          # 28 days
    allow_structured_metadata: true
    volume_enabled: true
    max_entries_limit_per_query: 500000
    max_query_parallelism: 32
    max_query_series: 200000
    split_queries_by_interval: 4m
    # Logs arrive over OTLP from the failover collector. Promote only the
    # low-cardinality service-identity resource attributes to INDEX labels;
    # every other attribute lands as structured metadata (queryable, not indexed).
    otlp_config:
      resource_attributes:
        attributes_config:
          - action: index_label
            attributes:
              - service.name
              - app
              - env
              - via        # optional marker for logs replayed from Kafka (see docs/kafka-failover.md)

  # Cache client tuning. Host names must match the memcached Services running in
  # your cluster — check with: kubectl get svc -n loki | grep -i cache
  memcached:
    chunk_cache:
      enabled: true
      host: chunk-cache-memcached.loki.svc
      batch_size: 256
      parallelism: 10
    results_cache:
      enabled: true
      host: results-cache-memcached.loki.svc
      default_validity: 2h

  pattern_ingester:
    enabled: true

  querier:
    max_concurrent: 8
  query_range:
    align_queries_with_step: true
    cache_results: true
    parallelise_shardable_queries: true
  query_scheduler:
    max_outstanding_requests_per_tenant: 4096

  # LogQL alerting/recording rules: alerts -> Alertmanager, recorded metrics -> Prometheus
  rulerConfig:
    enable_api: true
    alertmanager_url: "https://alertmanager.<YOUR_DOMAIN>"
    remote_write:
      enabled: true
      client:
        url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/write
    storage:
      type: s3
      s3:
        bucketnames: "<LOKI_S3_BUCKET>"
        region: "<AWS_REGION>"
        s3forcepathstyle: false

# Synthetic canary that writes + reads logs and exposes success metrics to Prometheus
lokiCanary:
  enabled: true
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3500"
    prometheus.io/path: /metrics

minio:
  enabled: false     # using real S3
