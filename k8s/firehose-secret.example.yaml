# EXAMPLE ONLY — do not commit real values.
#
# Shared secrets that Kinesis Firehose sends in the X-Amz-Firehose-Access-Key
# header. Alloy reads them via env vars (alloy.extraEnv in alloy/*.yaml).
# Use the SAME value as the "Access key" field of each Firehose HTTP-endpoint destination.
#
# Create it from the CLI instead of committing a file:
#   kubectl create secret generic alloy-firehose-access-keys -n loki \
#     --from-literal=api-v3="$(openssl rand -hex 24)" \
#     --from-literal=data-platform="$(openssl rand -hex 24)" \
#     --from-literal=payments="$(openssl rand -hex 24)"
apiVersion: v1
kind: Secret
metadata:
  name: alloy-firehose-access-keys
  namespace: loki
type: Opaque
stringData:
  api-v3: "<GENERATE_A_RANDOM_KEY>"
  data-platform: "<GENERATE_A_RANDOM_KEY>"
  payments: "<GENERATE_A_RANDOM_KEY>"
