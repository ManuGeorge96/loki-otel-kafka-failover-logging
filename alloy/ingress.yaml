# Public HTTPS entry points for Kinesis Firehose -> Alloy.
#
# Kinesis Firehose "HTTP endpoint" destinations require a public HTTPS URL,
# so each Alloy Firehose port gets its own hostname on one shared AWS ALB
# (AWS Load Balancer Controller). Requests are authenticated by the
# X-Amz-Firehose-Access-Key header, which Alloy checks against its access_key.
#
# Apply:  kubectl apply -f alloy/ingress.yaml
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alloy-firehose-ingress
  namespace: loki
  labels:
    app: grafana-alloy
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/subnets: "<PUBLIC_SUBNET_ID_1>,<PUBLIC_SUBNET_ID_2>"
    alb.ingress.kubernetes.io/certificate-arn: "<ACM_CERTIFICATE_ARN>"
    alb.ingress.kubernetes.io/listen-ports: '[{ "HTTP": 80 }, { "HTTPS": 443 }]'
    alb.ingress.kubernetes.io/actions.ssl-redirect: '{ "Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301" } }'
    alb.ingress.kubernetes.io/healthcheck-path: /metrics
    alb.ingress.kubernetes.io/success-codes: 200,404
spec:
  ingressClassName: alb
  rules:
    - host: alloy-firehose-api-v3.<YOUR_DOMAIN>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ssl-redirect
                port:
                  name: use-annotation
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alloy-api-v3
                port:
                  number: 9999

    - host: alloy-firehose-payments.<YOUR_DOMAIN>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ssl-redirect
                port:
                  name: use-annotation
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alloy-payments
                port:
                  number: 9999

    - host: alloy-firehose-payments-eventbridge.<YOUR_DOMAIN>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ssl-redirect
                port:
                  name: use-annotation
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alloy-payments
                port:
                  number: 9998

    - host: alloy-firehose-data-platform.<YOUR_DOMAIN>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ssl-redirect
                port:
                  name: use-annotation
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alloy-data-platform
                port:
                  number: 9997
