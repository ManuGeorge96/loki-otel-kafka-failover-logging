# Grafana Alloy producer — "payments" (two sources in one Alloy)
#   :9999  API Gateway logs       -> app = payments-api-gw
#   :9998  EventBridge event logs -> app = payments-eventbridge
#
# Each source gets its own parser and its own OTLP service identity; both share
# one batch processor and one exporter to the failover collector.
#
# Install:
#   helm upgrade --install alloy-payments grafana/alloy -n loki -f alloy/alloy-payments.yaml

alloy:
  extraPorts:
    - name: firehose-apigw
      port: 9999
      targetPort: 9999
      protocol: TCP
    - name: firehose-eb
      port: 9998
      targetPort: 9998
      protocol: TCP

  extraEnv:
    - name: FIREHOSE_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: alloy-firehose-access-keys
          key: payments

  configMap:
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      // ================= Receivers =================
      // API Gateway logs on :9999
      loki.source.awsfirehose "apigw" {
        http {
          listen_address = "0.0.0.0"
          listen_port    = 9999
        }
        access_key    = sys.env("FIREHOSE_ACCESS_KEY")
        relabel_rules = loki.relabel.logging_origin.rules
        forward_to    = [loki.process.apigw.receiver]
      }

      // EventBridge logs on :9998
      loki.source.awsfirehose "eventbridge" {
        http {
          listen_address = "0.0.0.0"
          listen_port    = 9998
        }
        access_key    = sys.env("FIREHOSE_ACCESS_KEY")
        relabel_rules = loki.relabel.logging_origin.rules
        forward_to    = [loki.process.eventbridge.receiver]
      }

      loki.relabel "logging_origin" {
        rule {
          action        = "replace"
          source_labels = ["__aws_cw_log_group"]
          target_label  = "log_group"
        }
        rule {
          action        = "replace"
          source_labels = ["__aws_cw_log_stream"]
          target_label  = "log_stream"
        }
        forward_to = []
      }

      // ================= Processors =================
      loki.process "apigw" {
        forward_to = [
          otelcol.receiver.loki.bridge_apigw.receiver,
          loki.echo.debug.receiver,
        ]
        stage.static_labels {
          values = {
            app = "payments-api-gw",
            env = "dev",
          }
        }
        stage.json {
          expressions = {
            apiId   = "apiId",
            apiName = "apiName",
          }
        }
        stage.labels {
          values = {
            apigID   = "apiId",
            apigName = "apiName",
          }
        }
      }

      loki.process "eventbridge" {
        forward_to = [
          otelcol.receiver.loki.bridge_eb.receiver,
          loki.echo.debug.receiver,
        ]
        stage.static_labels {
          values = {
            app = "payments-eventbridge",
            env = "dev",
          }
        }
        // EventBridge envelope: source, detail-type, and an app-specific field in detail
        stage.json {
          expressions = {
            source     = "source",
            detailType = "\"detail-type\"",
            event      = "detail.apiname",
          }
        }
        stage.labels {
          values = {
            eventSource = "source",
            detailType  = "detailType",
            event       = "event",
          }
        }
      }

      loki.echo "debug" { }

      // ================= OTLP bridges (one identity per source) =================
      otelcol.receiver.loki "bridge_apigw" {
        output {
          logs = [otelcol.processor.transform.identity_apigw.input]
        }
      }

      otelcol.processor.transform "identity_apigw" {
        error_mode = "ignore"
        log_statements {
          context = "resource"
          statements = [
            `set(attributes["service.name"], "payments-api-gw")`,
            `set(attributes["app"], "payments-api-gw")`,
            `set(attributes["env"], "dev")`,
          ]
        }
        output {
          logs = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.receiver.loki "bridge_eb" {
        output {
          logs = [otelcol.processor.transform.identity_eb.input]
        }
      }

      otelcol.processor.transform "identity_eb" {
        error_mode = "ignore"
        log_statements {
          context = "resource"
          statements = [
            `set(attributes["service.name"], "payments-eventbridge")`,
            `set(attributes["app"], "payments-eventbridge")`,
            `set(attributes["env"], "dev")`,
          ]
        }
        output {
          logs = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        send_batch_size = 1024
        timeout         = "1s"
        output {
          logs = [otelcol.exporter.otlp.failover_hub.input]
        }
      }

      otelcol.exporter.otlp "failover_hub" {
        client {
          endpoint = "otel-failover-collector.loki.svc.cluster.local:4317"
          tls {
            insecure = true
          }
        }
      }

serviceAccount:
  create: true
  name: alloy-payments

service:
  enabled: true
  type: NodePort
  nodePort: 31127
